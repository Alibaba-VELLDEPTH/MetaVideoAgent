[build-system]
requires = ["setuptools>=77", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "metavideoagent"
version = "0.1.0"
description = "Build and evolve MetaVideoAgent from a target video distribution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MetaVideoAgent Authors" }]
dependencies = [
  "chromadb>=0.5.23,<0.6",
  "httpx>=0.27.2,<0.29",
  "imageio-ffmpeg>=0.6,<0.7",
  "openai>=1.52,<2",
  "opencv-python-headless>=4.11.0.86,<4.12",
  "Pillow>=11.3,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
metavideoagent-automatic = "scripts.run_automatic:main"
metavideoagent-held-out = "scripts.run_held_out:main"

[tool.setuptools]
packages = [
  "evolution",
  "evolution.agent_docs",
  "evolution.agent_docs.capabilities",
  "execution",
  "execution.action_runtime",
  "scripts",
]
include-package-data = true

[tool.setuptools.package-data]
evolution = [
  "agent_docs/*.md",
  "agent_docs/*.json",
  "agent_docs/capabilities/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These executable modules intentionally establish their repository-local
# import paths before importing the runtime modules they launch.
"evolution/candidate_evaluator.py" = ["E402"]
"evolution/codex_evolve.py" = ["E402"]
"evolution/diagnosis_agent.py" = ["E402"]
"evolution/full_eval_runner.py" = ["E402"]
"evolution/initial_combo_runner.py" = ["E402"]
"evolution/sandbox_evaluator.py" = ["E402"]
"evolution/smoke_test_runner.py" = ["E402"]
"execution/run_evolution.py" = ["E402"]
"execution/run_initial_agent.py" = ["E402"]
